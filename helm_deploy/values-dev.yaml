---
# Per environment values which override defaults in hmpps-cell-sharing-risk-assessment-ui/values.yaml

generic-service:
  replicaCount: 1 # not in use yet

  ingress:
    host: cell-sharing-risk-assessment-dev.hmpps.service.justice.gov.uk

  env:
    INGRESS_URL: "https://cell-sharing-risk-assessment-dev.hmpps.service.justice.gov.uk"
    HMPPS_AUTH_URL: "https://sign-in-dev.hmpps.service.justice.gov.uk/auth"
    TOKEN_VERIFICATION_API_URL: "https://token-verification-api-dev.prison.service.justice.gov.uk"
    CSRA_API_URL: 'https://cell-sharing-risk-assessment-api-dev.hmpps.service.justice.gov.uk'
    PRISONER_SEARCH_API_URL: 'https://prisoner-search-dev.prison.service.justice.gov.uk'
    COMPONENT_API_URL: 'https://frontend-components-dev.hmpps.service.justice.gov.uk'
    DPS_URL: 'https://prisoner-dev.digital.prison.service.justice.gov.uk'
    BASM_URL: 'https://hmpps-book-secure-move-frontend-staging.apps.cloud-platform.service.justice.gov.uk'
    PRISON_API_URL: 'https://prison-api-dev.prison.service.justice.gov.uk'
    COURT_DATA_INGESTION_API_URL: 'https://court-data-ingestion-api-dev.hmpps.service.justice.gov.uk'
    DOCUMENT_API_URL: 'https://document-api-dev.hmpps.service.justice.gov.uk'
    # Court warrants proof of concept (MAPA-349). Dev only until the spike reports back.
    WARRANTS_ENABLED: 'true'
    MANAGE_USERS_API_URL: 'https://manage-users-api-dev.hmpps.service.justice.gov.uk'
    ENVIRONMENT_NAME: DEV
    AUDIT_ENABLED: "false"
    NOMIS_CSRA_MODULES: "OCDNOQUE,OIDCAPPR"

generic-prometheus-alerts:
  alertSeverity: move-a-prisoner-alerts-nonprod
